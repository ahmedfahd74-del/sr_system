name: Materialize SwingTech D20 baseline

on:
  push:
    branches:
      - swingtech/d20-hardening
    paths:
      - .github/workflows/materialize-swingtech-d20.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact uploaded Pine file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pinescripts
          cat .d20_payload/part_* > /tmp/swingtech_d20.pine.gz.b64
          base64 --decode /tmp/swingtech_d20.pine.gz.b64 | gzip -dc > pinescripts/swingtech_rebuild.pine
          test "$(wc -c < pinescripts/swingtech_rebuild.pine)" -eq 181701
          echo "474111f40213bbd2d51d719517dee80195e95ee5d34f9fcdb286b73e53064383  pinescripts/swingtech_rebuild.pine" | sha256sum -c -

      - name: Commit verified D20 baseline and remove staging artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "swingtech-materializer[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pinescripts/swingtech_rebuild.pine
          git rm -r .d20_payload
          git rm .github/workflows/materialize-swingtech-d20.yml
          git commit -m "feat(swingtech): publish verified D20 hardening baseline"
          git push origin HEAD:swingtech/d20-hardening
